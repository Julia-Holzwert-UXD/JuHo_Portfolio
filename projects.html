<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julia Holzwert - Projects</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="view.css">
</head>

<body>
  <!-- Filter Section -->
  <section class="filter-section" id="filters">
    <div class="filter-stats-box">
      <h3>Search Statistics</h3>
      <div class="search-stats">
        <div class="stat-block">
          <p>Total Projects</p>
          <span id="totalCount">0</span>
        </div>
        <div class="stat-block">
          <p>Visible</p>
          <span id="visibleCount">0</span>
        </div>
        <div class="stat-block">
          <p>Hidden</p>
          <span id="hiddenCount">0</span>
        </div>
      </div>

      <div class="filter-bar">
        <!-- Special buttons on top -->
        <button class="filter-btn special-btn" id="showAllBtn">SHOW ALL</button>
      </div>

      <div class="filter-bar">
        <!-- Regular filters -->
        <button class="filter-btn" data-filter="Redesign">Redesign</button>
        <button class="filter-btn" data-filter="Mobile-App">Mobile App</button>
        <button class="filter-btn" data-filter="Product-Design">Product Design</button>
        <button class="filter-btn" data-filter="Accessibility">Accessibility</button>
        <button class="filter-btn" data-filter="Health-Tech">Health Tech</button>
        <button class="filter-btn" data-filter="Data-Privacy">Data Privacy</button>
        <button class="filter-btn" data-filter="Immersive-Experience">Immersive Experience</button>
        <button class="filter-btn" data-filter="Ethical-Design">Ethical Design</button>
        <button class="filter-btn" data-filter="Public-Transport">Public Transport</button>
        <button class="filter-btn" data-filter="Group-Project">Group Projects</button>
      </div>

    </div>
    </div>
  </section>

  <section class="projects-section">
    <div class="projects-grid" id="projectsGrid"></div>
  </section>

  <button id="toTop">↑</button>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
  <script src="projects-data.js"></script>
  <script src="motion.js"></script>
  <script src="script.js"></script>

</body>

</html>
